<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>상담카드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg: #F4F5FA; --card: #fff; --line: #E2E4EE; --text: #15172A; --sub: #5B6080; --dim: #9094B0; --accent: #4B3FD9; --warn: #D9480F; --warnbg: #FFF1E8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif; font-size: 14px; line-height: 1.55; word-break: keep-all; }
  button, input, select { font: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
  header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
  header.top h1 { font-size: 20px; margin: 0; flex: 1; min-width: 200px; }
  .pill { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: #ECEBFF; color: var(--accent); font-weight: 600; }
  .pill.warn { background: var(--warnbg); color: var(--warn); }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .keybox { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px; max-width: 460px; }
  .keybox input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; margin: 8px 0 10px; }
  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .list { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; position: sticky; top: 12px; max-height: calc(100vh - 24px); display: flex; flex-direction: column; }
  .filters { padding: 10px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; }
  .filters input, .filters select { flex: 1; min-width: 0; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; }
  .items { overflow: auto; }
  .item { display: block; width: 100%; text-align: left; padding: 11px 14px; border: 0; border-bottom: 1px solid var(--line); background: #fff; cursor: pointer; }
  .item:hover { background: #F8F8FD; }
  .item.on { background: #ECEBFF; }
  .item .r1 { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
  .item .r2 { color: var(--sub); font-size: 12px; margin-top: 2px; }
  .item .st { font-size: 11px; font-weight: 600; color: var(--sub); }
  .item .st.new { color: var(--warn); }
  .empty { padding: 30px; color: var(--dim); text-align: center; }

  /* card (A4) */
  .sheet { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px 30px; }
  .ch { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 16px; }
  .ch h2 { margin: 0; font-size: 24px; }
  .ch h2 small { font-size: 14px; color: var(--sub); font-weight: 500; margin-left: 8px; }
  .ch .meta { color: var(--sub); font-size: 13px; text-align: right; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .blk { margin-bottom: 18px; break-inside: avoid; }
  .blk h3 { font-size: 13px; color: var(--accent); margin: 0 0 8px; letter-spacing: .02em; }
  .kv { display: grid; grid-template-columns: 88px 1fr; gap: 4px 10px; }
  .kv dt { color: var(--sub); }
  .kv dd { margin: 0; font-weight: 500; }
  .agenda { background: #F6F5FF; border-radius: 10px; padding: 12px 14px; }
  .agenda .q { font-size: 16px; font-weight: 700; margin-top: 4px; }
  .typebox { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; margin-bottom: 8px; }
  .typebox .t { font-size: 22px; font-weight: 800; white-space: nowrap; }
  .bars { display: grid; gap: 5px; }
  .bar { display: grid; grid-template-columns: 90px 1fr 20px; gap: 8px; align-items: center; font-size: 12px; }
  .bar .tr { height: 9px; background: #EEF0F6; border-radius: 99px; overflow: hidden; }
  .bar .f { height: 100%; border-radius: 99px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .ev { margin: 6px 0 0; padding-left: 18px; color: var(--sub); }
  .qs { display: grid; gap: 8px; }
  .qs .qi { display: grid; grid-template-columns: 100px 1fr; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
  .qs .qi b { font-size: 12px; color: var(--accent); }
  .qs .qi.warn { background: var(--warnbg); border-color: #FFD3B8; }
  .qs .qi.warn b { color: var(--warn); }
  table.raw { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.raw th, table.raw td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; }
  table.raw th { color: var(--sub); font-weight: 600; }
  table.raw td.n { text-align: right; font-variant-numeric: tabular-nums; }
  table.raw tr.fast td.n { color: var(--warn); font-weight: 700; }
  .follow { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 8px; }
  .follow span::before { content: '□ '; }
  .lines { height: 72px; background: repeating-linear-gradient(#fff 0 23px, var(--line) 23px 24px); }
  .foot { font-size: 11px; color: var(--dim); margin-top: 10px; }
  @media print {
    @page { size: A4; margin: 12mm; }
    body { background: #fff; font-size: 12px; }
    .noprint, header.top, .list { display: none !important; }
    .wrap { padding: 0; max-width: none; }
    .layout { display: block; }
    .sheet { border: 0; padding: 0; border-radius: 0; }
  }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script src="config.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  const E = window.ENGINE, C = window.CONFIG, D = E.DOMAINS;
  const root = document.getElementById('root');
  const TEST_MODE = !C.apiUrl;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
  let rows = [], cur = null;

  function header(extra) {
    return `<header class="top"><h1>상담카드 <span style="color:var(--sub);font-weight:500;font-size:14px">진로탐색 & 준비도 테스트</span></h1>
      ${TEST_MODE ? '<span class="pill warn">테스트 모드 · 예시 데이터</span>' : ''}${extra || ''}</header>`;
  }

  function askKey(msg) {
    root.innerHTML = header() + `<div class="keybox"><b>관리자 키 입력</b>
      <p style="color:var(--sub);margin:4px 0 0">Apps Script에서 setup 실행 시 로그에 나온 키입니다. 이 기기에만 저장됩니다.</p>
      <input id="k" type="password" autocomplete="off"><button class="btn primary" id="ok">불러오기</button>
      <p style="color:var(--warn);margin:10px 0 0">${esc(msg || '')}</p></div>`;
    document.getElementById('ok').onclick = () => { const v = document.getElementById('k').value.trim(); if (v) { store.set('cardKey', v); load(); } };
  }

  async function load() {
    if (TEST_MODE) { rows = sampleRows(); return renderMain(); }
    const key = store.get('cardKey');
    if (!key) return askKey();
    root.innerHTML = header() + '<div class="empty">불러오는 중…</div>';
    try {
      const res = await fetch(`${C.apiUrl}?action=list&limit=200&key=${encodeURIComponent(key)}`).then(r => r.json());
      if (!res.ok) { store.del('cardKey'); return askKey(res.error); }
      rows = res.rows; renderMain();
    } catch (e) { askKey('불러오기 실패: ' + e.message); }
  }

  function renderMain() {
    root.innerHTML = header(`<button class="btn noprint" id="reload">새로고침</button><button class="btn primary noprint" id="print">카드 인쇄</button>`) + `
      <div class="layout">
        <aside class="list">
          <div class="filters"><input id="q" placeholder="이름·연락처 검색"><select id="fs"><option value="">전체 상태</option>${['신규','상담중','연락완료','상담예약','상담완료','체험참여','등록','보류','부재'].map(s => `<option>${s}</option>`).join('')}</select></div>
          <div class="items" id="items"></div>
        </aside>
        <section id="card"><div class="sheet empty">왼쪽 목록에서 신청자를 고르세요.</div></section>
      </div>`;
    document.getElementById('reload').onclick = load;
    document.getElementById('print').onclick = () => { if (cur) window.print(); };
    document.getElementById('q').oninput = renderList;
    document.getElementById('fs').onchange = renderList;
    renderList();
    if (rows.length) showCard(rows[0].id);
  }

  function renderList() {
    const q = document.getElementById('q').value.trim(), fs = document.getElementById('fs').value;
    const list = rows.filter(r => (!q || String(r.name).includes(q) || String(r.phone).replace(/\D/g, '').includes(q.replace(/\D/g, '') || '§')) && (!fs || r.status === fs));
    const box = document.getElementById('items');
    if (!list.length) { box.innerHTML = '<div class="empty">신청 내역이 없습니다.</div>'; return; }
    box.innerHTML = list.map(r => {
      const res = r.detail && r.detail.ans ? E.compute(r.detail.ans) : null;
      return `<button class="item${cur === r.id ? ' on' : ''}" data-id="${esc(r.id)}">
        <div class="r1"><span>${esc(r.name)}</span><span class="st${r.status === '신규' || r.status === '상담중' ? ' new' : ''}">${r.mode === '현장상담' ? '현장 · ' : ''}${esc(r.status)}</span></div>
        <div class="r2">${esc(r.at)} · ${esc(r.src)} · ${res ? D[res.top1].name + '/' + D[res.top2].name : '-'}</div></button>`;
    }).join('');
    box.querySelectorAll('.item').forEach(b => b.onclick = () => showCard(b.dataset.id));
  }

  function showCard(id) {
    cur = id;
    document.querySelectorAll('.item').forEach(b => b.classList.toggle('on', b.dataset.id === id));
    const row = rows.find(r => r.id === id);
    const a = row.detail && row.detail.ans;
    const box = document.getElementById('card');
    if (!a) { box.innerHTML = '<div class="sheet empty">응답 상세가 없습니다.</div>'; return; }
    const r = E.compute(a);
    const d1 = D[r.top1], d2 = D[r.top2];
    const track = a.track || 'teen';
    const ageLabel = (E.AGE.find(x => x.v === a.age) || {}).label || '';
    const curious = [].concat(a.curious || []).map(v => (E.CURIOUS[track].find(x => x.v === v) || {}).label).filter(Boolean).join(', ') || '-';
    const exp = (E.STATE_QS[0].options.find(o => o.v === a.exp) || {}).label || '-';
    const goal = (E.STATE_QS[1].options[track].find(o => o.v === a.goal) || {}).label || '-';
    const time = (E.STATE_QS[2].options.find(o => o.v === a.time) || {}).label || '-';
    const qs = E.counselorQuestions(r, a);
    const warnTags = ['빠른 응답', '모르겠음 선택', '관심 분산', '목표-경험 차이', '반복 작업 회피'];
    const ev = d => (r.evidence[d] || []).map(e => `<li>${e.q}번 · ${esc(e.text)}</li>`).join('') || '<li>직접 선택된 문항 없음 (상대적 순위)</li>';
    const rawRows = E.PAIRS.map(p => {
      const pick = a.picks[p.id]; const o = p.a.d === pick ? p.a : p.b.d === pick ? p.b : null;
      const t = a.times && a.times[p.id];
      return `<tr class="${t != null && t < 1500 ? 'fast' : ''}"><td>${p.id}${p.grind ? ' (반복)' : ''}</td><td>${o ? esc(o.text) : '-'}</td><td>${o ? D[o.d].name : '-'}</td><td class="n">${t != null ? (t / 1000).toFixed(1) + '초' : '-'}</td></tr>`;
    }).join('') + (() => {
      const o = E.Q10.options.find(x => x.d === a.q10); const t = a.times && a.times[10];
      return `<tr class="${t != null && t < 1500 ? 'fast' : ''}"><td>10</td><td>${o ? esc(o.text) : '-'}</td><td>${o && D[o.d] ? D[o.d].name : '모르겠음'}</td><td class="n">${t != null ? (t / 1000).toFixed(1) + '초' : '-'}</td></tr>`;
    })();

    box.innerHTML = `<article class="sheet">
      <div class="ch">
        <div><h2>${esc(row.name)}<small>${esc(row.phone)}</small></h2>
          <div style="color:var(--sub);margin-top:4px">${row.mode === '현장상담' ? '<b style="color:var(--accent)">현장 상담</b> · ' : ''}${esc(ageLabel)}${row.guardian ? ' (보호자 동의: ' + esc(row.guardian) + ')' : ''}${row.mode === '현장상담' ? '' : ' · 연락 희망 ' + esc(row.when || '-')} · 문자수신 ${row.marketing === 'Y' ? '동의' : '미동의'}</div></div>
        <div class="meta">${esc(row.id)}<br>${esc(row.at)}<br>유입: <b>${esc(row.src)}</b></div>
      </div>

      <div class="blk agenda">
        <h3>본인이 정한 상담 의제</h3>
        <div>알고 싶은 것: <b>${esc(curious)}</b> · 더 와닿은 결과: <b>${esc(row.feel || '-')}</b></div>
        <div class="q">${row.question ? '“' + esc(row.question) + '”' : '<span style="color:var(--dim);font-weight:500">직접 쓴 질문 없음</span>'}</div>
        ${row.differ ? '<div style="margin-top:6px">생각과 달랐던 부분: <b>“' + esc(row.differ) + '”</b></div>' : ''}
      </div>

      <div class="grid2">
        <div class="blk">
          <h3>관심 결과 (상대적 관심도, 최대 4)</h3>
          <div class="typebox"><span class="t" style="color:${d1.color}">${d1.type}</span><span>${d1.name} 1위 · ${d2.name} 2위</span></div>
          <div class="bars">${r.rank.map(k => `<div class="bar"><span>${D[k].name}</span><div class="tr"><div class="f" style="width:${r.scores[k] / 4 * 100}%;background:${D[k].color}"></div></div><span>${r.scores[k]}</span></div>`).join('')}</div>
        </div>
        <div class="blk">
          <h3>준비 상태 — ${E.LEVELS[r.level].name}</h3>
          <dl class="kv"><dt>제작 경험</dt><dd>${esc(exp)}</dd><dt>목표</dt><dd>${esc(goal)}</dd><dt>주당 시간</dt><dd>${esc(time)}</dd><dt>첫 과제</dt><dd>${esc(d1.task[r.level])}</dd></dl>
        </div>
      </div>

      <div class="grid2">
        <div class="blk"><h3>1위 근거 · ${d1.name}</h3><ul class="ev">${ev(r.top1)}</ul></div>
        <div class="blk"><h3>2위 근거 · ${d2.name}</h3><ul class="ev">${ev(r.top2)}</ul></div>
      </div>

      <div class="blk">
        <h3>응답 패턴과 상담 시작 질문</h3>
        <div class="qs">${qs.map(q => `<div class="qi${warnTags.includes(q.tag) ? ' warn' : ''}"><b>${esc(q.tag)}</b><span>${esc(q.text)}</span></div>`).join('')}</div>
      </div>

      <div class="blk">
        <h3>응답 원본</h3>
        <table class="raw"><thead><tr><th style="width:56px">문항</th><th>고른 작업</th><th style="width:90px">분야</th><th style="width:64px;text-align:right">응답시간</th></tr></thead><tbody>${rawRows}</tbody></table>
      </div>

      <div class="blk">
        <h3>후속 기록</h3>
        <div class="follow"><span>상담 완료</span><span>체험 참여 (분야: ______ )</span><span>등록</span><span>보류</span><span>재연락 ____/____</span></div>
        <div class="lines"></div>
      </div>
      <div class="foot">자체 진로탐색 도구 결과입니다. 능력·합격 가능성 판정으로 설명하지 마세요. 이 카드는 상담 후 파기하거나 잠금 보관하세요.</div>
    </article>`;
  }

  // 테스트 모드용 예시 데이터
  function sampleRows() {
    const mk = (name, src, age, track, picks, q10, exp, goal, time, fast, question, feel) => {
      const times = {}; for (let i = 1; i <= 10; i++) times[i] = fast ? 700 + i * 40 : 2400 + (i * 517) % 3000;
      return { id: 'SAMPLE-' + name, at: '2026-11-26 14:0' + name.length, name, phone: '010-0000-000' + name.length, when: '평일 저녁', src, age, track,
        question, feel, marketing: 'N', status: src === '현장상담' ? '상담중' : '신규', mode: src === '현장상담' ? '현장상담' : '온라인', differ: src === '현장상담' ? '3D가 낮게 나와서 의외였어요' : '', detail: { ans: { age, track, curious: ['fit', 'portfolio'], picks, q10, exp, goal, time, times } } };
    };
    return [
      mk('예시학생', '현장상담', 'teen', 'teen', { 1: 'art', 2: 'toon', 3: 'novel', 4: 'plan', 5: 'model', 6: 'art', 7: 'art', 8: 'dev', 9: 'novel' }, 'toon', 0, 'soon', 1, false, '그림 실력이 부족해도 입시 준비가 가능한가요?', '둘 다 비슷'),
      mk('예시취준생', 'QR_로비', 'adult', 'adult', { 1: 'toon', 2: 'novel', 3: 'plan', 4: 'dev', 5: 'dev', 6: 'model', 7: 'plan', 8: 'dev', 9: 'model' }, 'dev', 1, 'soon', 2, false, '전공자가 아니어도 프로그래머 취업이 되나요?', '프로그래밍'),
      mk('예시빠른응답', 'direct', 'teen', 'teen', { 1: 'art', 2: 'novel', 3: 'plan', 4: 'dev', 5: 'model', 6: 'art', 7: 'plan', 8: 'toon', 9: 'novel' }, 'unsure', 0, 'explore', 0, true, '', '')
    ];
  }

  load();
})();
</script>
</body>
</html>
